server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 15s
  application:
    name: sanitigo-notification-service

  sql:
    init:
      mode: always

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_URL:}}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:sanitigo_app}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 10

  datasource:
    url: ${DATABASE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/sanitigo}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

sanitigo:
  rabbitmq:
    exchange: sanitigo.events
    queue: sanitigo.booking.events
    dead-letter-exchange: sanitigo.dlx
    dead-letter-queue: sanitigo.booking.events.dlq
    dead-letter-routing-key: sanitigo.booking.events.dlq

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5433/sanitigo_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

---
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_URL:}}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:sanitigo_app}
    password: ${RABBITMQ_PASSWORD:}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}


---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_URL:}}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}

