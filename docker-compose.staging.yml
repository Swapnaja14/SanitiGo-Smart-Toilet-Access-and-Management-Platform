services:
  # ---------------------------------------------------------------------------
  # 1. Staging Message Broker (RabbitMQ)
  # ---------------------------------------------------------------------------
  rabbitmq-staging:
    image: rabbitmq:3.13-management-alpine
    container_name: sanitigo-staging-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-sanitigo_staging}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be provided}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_staging_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sanitigo_staging_net

  # ---------------------------------------------------------------------------
  # 2. Node.js Backend API (Connected to Neon Serverless Postgres Staging Branch)
  # ---------------------------------------------------------------------------
  backend-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanitigo-staging-backend
    restart: unless-stopped
    depends_on:
      rabbitmq-staging:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?Neon staging pooled DATABASE_URL must be provided}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?Neon staging unpooled DATABASE_URL must be provided}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be provided}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be provided}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      RABBITMQ_HOST: rabbitmq-staging
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-sanitigo_staging}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_USERNAME:-sanitigo_staging}:${RABBITMQ_PASSWORD}@rabbitmq-staging:5672}
      RABBITMQ_EXCHANGE: sanitigo.events
      PAYMENT_MODE: ${PAYMENT_MODE:-razorpay}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET must be provided}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?RAZORPAY_KEY_ID must be provided}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?RAZORPAY_KEY_SECRET must be provided}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sanitigo_staging_net

  # ---------------------------------------------------------------------------
  # 3. Java Spring Boot Notification Consumer Service
  # ---------------------------------------------------------------------------
  notification-staging:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: sanitigo-staging-notification
    restart: unless-stopped
    depends_on:
      backend-staging:
        condition: service_healthy
      rabbitmq-staging:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DATABASE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://ep-gentle-queen-b3sr1xis.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
      DATABASE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-neondb_owner}
      DATABASE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      RABBITMQ_HOST: rabbitmq-staging
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-sanitigo_staging}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_USERNAME:-sanitigo_staging}:${RABBITMQ_PASSWORD}@rabbitmq-staging:5672}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f java || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sanitigo_staging_net

  # ---------------------------------------------------------------------------
  # 4. Frontend (React 19 + Nginx Reverse Proxy with HTTPS readiness)
  # ---------------------------------------------------------------------------
  frontend-staging:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: sanitigo-staging-frontend
    restart: unless-stopped
    depends_on:
      backend-staging:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sanitigo_staging_net

volumes:
  rabbitmq_staging_data:

networks:
  sanitigo_staging_net:
    driver: bridge
